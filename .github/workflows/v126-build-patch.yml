name: Build V126 diagnostics patch

on:
  push:
    branches:
      - chatgpt/v126-diagnostics-backups-simple-ui

permissions:
  contents: write

jobs:
  build-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V126 Settings changes
        shell: bash
        run: |
          if grep -q 'BackupDiagnosticsPanel' src/pages/Settings.tsx; then
            echo "V126 Settings changes already present."
          else
            python .github/patches/apply_v126.py
          fi

      - name: Build patch ZIP
        shell: bash
        run: |
          rm -rf _patch_v126 PATCH_V126_DIAGNOSTICS_BACKUPS_SIMPLE_UI.zip
          mkdir -p _patch_v126/src/pages _patch_v126/src/components/settings
          cp src/pages/Settings.tsx _patch_v126/src/pages/Settings.tsx
          cp src/components/settings/BackupDiagnosticsPanel.tsx _patch_v126/src/components/settings/BackupDiagnosticsPanel.tsx
          cd _patch_v126
          zip -r ../PATCH_V126_DIAGNOSTICS_BACKUPS_SIMPLE_UI.zip src

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: PATCH_V126_DIAGNOSTICS_BACKUPS_SIMPLE_UI
          path: PATCH_V126_DIAGNOSTICS_BACKUPS_SIMPLE_UI.zip
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck
        continue-on-error: true
        shell: bash
        run: |
          npm ci
          npm run typecheck --if-present

      - name: Commit generated Settings source
        shell: bash
        run: |
          if git diff --quiet -- src/pages/Settings.tsx; then
            echo "No Settings source change to commit."
            exit 0
          fi
          git config user.name "ChatGPT Patch Builder"
          git config user.email "noreply@chatgpt.com"
          git add src/pages/Settings.tsx
          git commit -m "PATCH_V126_DIAGNOSTICS_BACKUPS_SIMPLE_UI"
          git push
