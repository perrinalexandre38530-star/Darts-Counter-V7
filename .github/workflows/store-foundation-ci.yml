name: MULTISPORTS Store Foundation CI

on:
  pull_request:
    branches:
      - main
      - agent/multisports-store-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-store-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies and refresh lockfile
        run: npm install

      - name: Validate release registry
        run: npm run test:release

      - name: Verify MULTISPORTS launcher source icons
        shell: bash
        run: |
          echo 'faf045b9a798c8c8ebe60b402a443aa33ec0fdff6819926a976534fd1d9e95e8  public/app-192.png' | sha256sum -c -
          echo '46f072fa71d34f4c48dd98c91c52f74e847df8b0d04a22f05b7f64588345099d  public/app-512.png' | sha256sum -c -

      - name: Guard direct R2 Android restore
        shell: bash
        run: |
          if grep -q 'readNasAccessToken' src/lib/cloudAutoRestore.ts; then
            echo 'cloudAutoRestore must not depend on a NAS JWT: direct R2 accepts Supabase or NAS auth.'
            exit 1
          fi
          grep -q 'Capacitor.isNativePlatform' src/lib/cloudAutoRestore.ts
          grep -q 'hydrateStoreUserMedia' src/lib/cloudAutoRestore.ts
          grep -q 'VITE_CLOUDFLARE_PAGES_ORIGIN' vite.config.ts
          grep -q 'Access-Control-Allow-Origin' functions/api/storage/backups/_middleware.ts

      - name: TypeScript
        run: npm run typecheck

      - name: Build Beta
        run: npm run build:beta

      - name: Build Store
        run: npm run build:store

      # Android regression gate: native boot must skip all PWA SW/cache work.
      - name: Build Android web bundle
        run: npm run build:android

      - name: Verify Android bundle uses Cloudflare R2 origin
        shell: bash
        run: |
          grep -R -q 'darts-counter-v7.pages.dev/api/storage/backups' dist

      - name: Create or sync Capacitor Android project
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Enforce Android API 36
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/variables.gradle')
          if not p.exists():
              raise SystemExit('android/variables.gradle not found')
          text = p.read_text()
          text = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', text)
          text = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', text)
          p.write_text(text)
          PY
          npx cap sync android

      - name: Apply official MULTISPORTS SCORING Android icon
        shell: bash
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          declare -A LEGACY=(
            [mdpi]=48
            [hdpi]=72
            [xhdpi]=96
            [xxhdpi]=144
            [xxxhdpi]=192
          )
          declare -A FOREGROUND=(
            [mdpi]=108
            [hdpi]=162
            [xhdpi]=216
            [xxhdpi]=324
            [xxxhdpi]=432
          )

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert public/app-192.png -resize "${LEGACY[$density]}x${LEGACY[$density]}" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            convert public/app-512.png -resize "${FOREGROUND[$density]}x${FOREGROUND[$density]}" "$dir/ic_launcher_foreground.png"
          done

          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#000000</color>
          </resources>
          EOF

          echo 'Official MULTISPORTS SCORING launcher icon applied.'

      - name: Build Android AAB and debug APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --stacktrace

      - name: Upload unsigned Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: multisports-scoring-android-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload installable Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: multisports-scoring-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit generated Android project
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android
          if git diff --cached --quiet; then
            echo "No generated Android changes to commit."
            exit 0
          fi
          git commit -m "chore(android): sync official launcher icon and native project [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
