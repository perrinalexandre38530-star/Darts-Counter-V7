name: MULTISPORTS Store Foundation CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-store-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies and refresh lockfile
        run: npm install

      - name: Validate release registry
        run: npm run test:release

      - name: Guard direct R2 Android restore
        shell: bash
        run: |
          if grep -q 'readNasAccessToken' src/lib/cloudAutoRestore.ts; then
            echo 'cloudAutoRestore must not depend on a NAS JWT: direct R2 accepts Supabase or NAS auth.'
            exit 1
          fi
          grep -q 'Capacitor.isNativePlatform' src/lib/cloudAutoRestore.ts
          grep -q 'hydrateStoreUserMedia' src/lib/cloudAutoRestore.ts

      - name: TypeScript
        run: npm run typecheck

      - name: Build Beta
        run: npm run build:beta

      - name: Build Store
        run: npm run build:store

      # Android regression gate: native boot must skip all PWA SW/cache work.
      - name: Build Android web bundle
        run: npm run build:android

      - name: Create or sync Capacitor Android project
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Enforce Android API 36
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/variables.gradle')
          if not p.exists():
              raise SystemExit('android/variables.gradle not found')
          text = p.read_text()
          text = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', text)
          text = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', text)
          p.write_text(text)
          PY
          npx cap sync android

      - name: Build Android AAB and debug APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --stacktrace

      - name: Upload unsigned Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: multisports-scoring-android-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload installable Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: multisports-scoring-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit generated Android project
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android
          if git diff --cached --quiet; then
            echo "No generated Android changes to commit."
            exit 0
          fi
          git commit -m "chore(android): generate Capacitor project [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
