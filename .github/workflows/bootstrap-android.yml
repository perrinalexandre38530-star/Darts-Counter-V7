name: Bootstrap MULTISPORTS Android

on:
  push:
    branches:
      - agent/multisports-store-foundation
    paths:
      - package.json

permissions:
  contents: write

jobs:
  bootstrap-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/multisports-store-foundation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Refresh npm lockfile
        run: npm install

      - name: Validate Store scope
        run: npm run test:release

      - name: TypeScript
        run: npm run typecheck

      - name: Build Android web bundle
        run: npm run build:android

      - name: Create or sync Capacitor Android project
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Enforce Android API 36
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/variables.gradle')
          if not p.exists():
              raise SystemExit('android/variables.gradle not found')
          text = p.read_text()
          text = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', text)
          text = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', text)
          p.write_text(text)
          PY
          npx cap sync android

      - name: Build Android App Bundle
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: multisports-scoring-android-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Commit generated Android project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android
          if git diff --cached --quiet; then
            echo "No generated Android changes to commit."
            exit 0
          fi
          git commit -m "chore(android): bootstrap Capacitor Android [skip ci]"
          git push origin HEAD:agent/multisports-store-foundation
