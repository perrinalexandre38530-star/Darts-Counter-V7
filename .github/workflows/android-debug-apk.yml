name: MULTISPORTS SCORING - Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "tools/**"
      - ".github/workflows/android-debug-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "tools/**"
      - ".github/workflows/android-debug-apk.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install JS dependencies
        run: npm ci

      - name: Android policy regressions
        run: |
          npm run test:android-bootstrap
          npm run test:android-store-v1
          npm run test:admob-native
          npm run test:play-billing

      - name: Build and sync Capacitor Android
        run: npm run android:sync

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: multisports-scoring-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
