name: MULTISPORTS SCORING - Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "tools/**"
      - ".github/workflows/android-debug-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "tools/**"
      - ".github/workflows/android-debug-apk.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # Le package Android SDK "tools" n'existe plus ; ne pas utiliser le défaut de v3.
          packages: "platform-tools"

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install FFmpeg for Android media optimization
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version
          ffmpeg -hide_banner -encoders > "$RUNNER_TEMP/mss-ffmpeg-encoders.txt"
          grep -q libmp3lame "$RUNNER_TEMP/mss-ffmpeg-encoders.txt"

      - name: Install JS dependencies
        run: npm ci

      - name: Android policy regressions
        run: |
          npm run test:android-bootstrap
          node tools/test-android-generated-png.mjs
          node tools/test-android-referenced-wav.mjs
          node tools/test-deduplicate-android-hashed-media.mjs
          npm run test:android-store-v1
          npm run test:admob-native
          npm run test:play-billing

      - name: Build and sync Capacitor Android
        run: npm run android:sync

      - name: Upload Android media diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-local-media-diagnostics
          path: android-local-media-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: multisports-scoring-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
