name: Pack JDC Patch (8 fichiers)
on:
  push:
    branches:
      - chatgpt/jdc-guide-premium-test-20261109
    paths:
      - '.github/workflows/jdc-patch-package.yml'
      - 'src/pages/ChallengePlay.tsx'
      - 'src/pages/HistoryPage.tsx'
      - 'src/main.tsx'
      - 'src/lib/appRecovery.ts'
      - 'src/lib/challengeResultsExport.ts'
      - 'src/lib/challengeFullReport.ts'
      - 'src/components/ChallengeReportUI.tsx'
      - 'functions/api/report-download.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Construire le ZIP des seuls fichiers modifies
    runs-on: ubuntu-latest
    steps:
      - name: Lire la branche exacte
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Construire le paquet sans fichiers parasites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          files=(
            src/components/ChallengeReportUI.tsx
            src/lib/appRecovery.ts
            src/lib/challengeResultsExport.ts
            src/lib/challengeFullReport.ts
            src/main.tsx
            src/pages/ChallengePlay.tsx
            src/pages/HistoryPage.tsx
            functions/api/report-download.ts
          )
          for file in "${files[@]}"; do
            test -f "$file"
            mkdir -p "package/$(dirname "$file")"
            cp "$file" "package/$file"
          done
          test "$(find package -type f | wc -l)" -eq 8
          {
            echo "### Patch MULTISPORTS SCORING - JDC / Challenge"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Base de comparaison avec main: \`bae70244ae59e78027bc8952c54a3ac81eebf36f\`"
            echo "- Fichiers à extraire à la racine du projet :"
            printf '%s\n' "${files[@]}" | sed 's/^/- /'
            echo ""
            echo "Le ZIP contient strictement ces 8 fichiers. Ne pas le remplacer par une archive complete du depot."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fournir le ZIP a telecharger
        uses: actions/upload-artifact@v4
        with:
          name: MSS_JDC_PATCH_8_FICHIERS_${{ github.sha }}
          path: package/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
