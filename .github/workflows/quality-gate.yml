name: MULTISPORTS SCORING - Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: mss-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build + regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repository preflight
        run: node ./tools/test-repo-preflight.mjs
      - run: npm ci
      - run: npm run test:auto

  live-cloud:
    name: Supabase live E2E
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repository preflight
        run: node ./tools/test-repo-preflight.mjs
      - run: npm ci
      - name: Detect live-test configuration
        id: live
        shell: bash
        run: |
          if [[ -n "$SUPABASE_TEST_URL" && -n "$SUPABASE_TEST_ANON_KEY" && -n "$SUPABASE_TEST_SERVICE_ROLE_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run real Supabase E2E tests
        if: steps.live.outputs.ready == 'true'
        run: npm run test:live
      - name: Live E2E not configured
        if: steps.live.outputs.ready != 'true'
        run: echo "::warning::Live Supabase E2E skipped. Configure SUPABASE_TEST_URL, SUPABASE_TEST_ANON_KEY and SUPABASE_TEST_SERVICE_ROLE_KEY in GitHub Actions secrets."
