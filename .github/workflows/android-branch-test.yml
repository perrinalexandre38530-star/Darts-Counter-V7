name: MULTISPORTS Android Branch Test

on:
  push:
    branches:
      - agent/multisports-store-foundation
  workflow_dispatch:

jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/multisports-store-foundation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Validate Store scope
        run: npm run test:release

      - name: Guard direct R2 restore
        shell: bash
        run: |
          if grep -q 'readNasAccessToken' src/lib/cloudAutoRestore.ts; then
            echo 'Android R2 restore still depends on NAS auth.'
            exit 1
          fi
          grep -q 'hydrateStoreUserMedia' src/lib/cloudAutoRestore.ts

      - name: TypeScript
        run: npm run typecheck

      - name: Build Android
        run: npm run build:android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: multisports-scoring-android-debug-apk-v3-data-sync
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
