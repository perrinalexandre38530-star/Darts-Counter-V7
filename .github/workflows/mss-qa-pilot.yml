name: MSS QA Agent - read-only evidence

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Existing approved QA issue number"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: mss-qa-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  qa_pilot:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'mss:approved' && github.event.issue.state == 'open')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout only the QA pilot files
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            tools/mss-qa-pilot.mjs
            tools/test-mss-qa-pilot.mjs
          sparse-checkout-cone-mode: false
      - name: Verify the QA pilot itself
        run: node --test tools/test-mss-qa-pilot.mjs
      - name: Audit approved QA mission and post evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: node tools/mss-qa-pilot.mjs
