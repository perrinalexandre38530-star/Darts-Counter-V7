name: Football V10 Validate

on:
  push:
    branches:
      - artifact-football-v10-gameplay-config-v13
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Football V10 UX regression
        run: node tools/test-football-ux-v10.mjs
      - name: Build
        run: npm run build
      - name: Publish patch only
        uses: actions/upload-artifact@v4
        with:
          name: PATCH_V13_DARTS_FOOTBALL_V10_GAMEPLAY_CONFIG
          if-no-files-found: error
          retention-days: 7
          path: |
            src/pages/FootballConfig.tsx
            src/styles/football-config.css
            src/styles/football-play.css
            tools/test-football-ux-v10.mjs
