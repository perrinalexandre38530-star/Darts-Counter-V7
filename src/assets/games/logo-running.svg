<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Running Scoring</title>
  <desc id="desc">Logo running dynamique pour Multisports Scoring</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#1f2834"/>
      <stop offset="1" stop-color="#070b11"/>
    </radialGradient>
    <linearGradient id="run" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfff72"/>
      <stop offset="1" stop-color="#4ff5a0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="224" fill="url(#bg)" stroke="#7df6a6" stroke-opacity=".38" stroke-width="6"/>
  <path d="M106 353c79 29 183 38 298 3" fill="none" stroke="#7df6a6" stroke-opacity=".24" stroke-width="15" stroke-linecap="round"/>
  <g fill="none" stroke="url(#run)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <circle cx="296" cy="125" r="30" fill="#dfff72" stroke="none"/>
    <path d="M284 169l-53 52 42 48 62-24" stroke-width="25"/>
    <path d="M237 218l-63 10" stroke-width="23"/>
    <path d="M273 269l-49 88" stroke-width="27"/>
    <path d="M273 269l82 66" stroke-width="27"/>
    <path d="M333 245l42-62" stroke-width="21"/>
  </g>
  <text x="256" y="418" text-anchor="middle" fill="#eefaf1" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="900" letter-spacing="4">RUNNING</text>
  <text x="256" y="452" text-anchor="middle" fill="#7df6a6" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="800" letter-spacing="6">SCORING</text>
</svg>
