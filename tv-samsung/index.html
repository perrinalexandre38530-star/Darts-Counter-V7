<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>MULTISPORTS SCORING</title>
    <!-- Compatibilité JavaScript Samsung Tizen 6.5 : exécuter AVANT le bundle ESM.
         Les moteurs X01 et plusieurs jeux emploient structuredClone. -->
    <script>
      (function () {
        if (typeof globalThis.structuredClone === "function") return;
        function clone(value, seen) {
          if (value === null || typeof value !== "object") return value;
          if (seen.has(value)) return seen.get(value);
          if (value instanceof Date) return new Date(value.getTime());
          if (value instanceof RegExp) return new RegExp(value.source, value.flags);
          if (value instanceof ArrayBuffer) return value.slice(0);
          if (ArrayBuffer.isView(value)) {
            if (value instanceof DataView) return new DataView(clone(value.buffer, seen), value.byteOffset, value.byteLength);
            return new value.constructor(value);
          }
          if (value instanceof Map) {
            var m = new Map(); seen.set(value, m);
            value.forEach(function (v, k) { m.set(clone(k, seen), clone(v, seen)); });
            return m;
          }
          if (value instanceof Set) {
            var s = new Set(); seen.set(value, s);
            value.forEach(function (v) { s.add(clone(v, seen)); });
            return s;
          }
          var result = Array.isArray(value) ? [] : {};
          seen.set(value, result);
          Object.keys(value).forEach(function (key) {
            result[key] = clone(value[key], seen);
          });
          return result;
        }
        globalThis.structuredClone = function (value) { return clone(value, new Map()); };
        globalThis.__MSS_TIZEN_STRUCTURED_CLONE_COMPAT__ = "V240";
      })();
    </script>
    <!-- Samsung TV uses file:// and Vite publicDir:false; React's /sounds, /challenge,
         /awena, ... paths must be mapped before the first game renders. -->
    <script>
      (function () {
        var localDirs = /^(assets|sounds|challenge|awena|cast|fit)\//i;
        var online = "https://multisports-scoring.pages.dev";
        function fix(value) {
          if (typeof value !== "string" || value.charAt(0) !== "/" || value.charAt(1) === "/") return value;
          var bare = value.replace(/^\/+/, "");
          return localDirs.test(bare) ? "./" + bare : online + "/" + bare;
        }
        window.__MSS_TV_RESOLVE_MEDIA__ = fix;
        var origSetAttribute = Element.prototype.setAttribute;
        Element.prototype.setAttribute = function (name, value) {
          var tag = String(this.tagName || "").toLowerCase();
          if (/^(img|audio|video|source)$/i.test(tag) && /^(src|poster)$/i.test(String(name))) {
            value = fix(String(value));
          }
          return origSetAttribute.call(this, name, value);
        };
        [window.HTMLImageElement, window.HTMLMediaElement].forEach(function (ctor) {
          if (!ctor) return;
          var desc = Object.getOwnPropertyDescriptor(ctor.prototype, "src");
          if (desc && desc.configurable && desc.get && desc.set) {
            Object.defineProperty(ctor.prototype, "src", {
              configurable: true, enumerable: desc.enumerable,
              get: desc.get,
              set: function (url) { desc.set.call(this, fix(String(url))); }
            });
          }
        });
        if (window.HTMLMediaElement) {
          var origPlay = HTMLMediaElement.prototype.play;
          HTMLMediaElement.prototype.play = function () {
            var raw = this.getAttribute("src") || "";
            if (raw.charAt(0) === "/") this.setAttribute("src", fix(raw));
            return origPlay.apply(this, arguments);
          };
        }
        // React may create inline CSS background URLs rather than <img> nodes.
        function repair(root) {
          if (!root || !root.querySelectorAll) return;
          var nodes = root.querySelectorAll('[style*="url(/"], [style*="url(&quot;/"]');
          for (var i = 0; i < nodes.length; i++) {
            var node = nodes[i];
            var style = node.getAttribute("style") || "";
            var fixed = style.replace(/url\(\s*(["']?)(\/(?!\/)[^)'"\s]+)\1\s*\)/g,
              function (_all, quote, url) { return "url(" + quote + fix(url) + quote + ")"; });
            if (fixed !== style) node.setAttribute("style", fixed);
          }
        }
        document.addEventListener("DOMContentLoaded", function () {
          repair(document);
          if (!window.MutationObserver) return;
          var observer = new MutationObserver(function (mutations) {
            for (var i = 0; i < mutations.length; i++) {
              var m = mutations[i];
              if (m.type === "attributes" && m.target instanceof Element) {
                repair(m.target.parentElement || document);
              } else if (m.addedNodes) {
                for (var j = 0; j < m.addedNodes.length; j++) {
                  var child = m.addedNodes[j];
                  if (child.nodeType === 1) repair(child);
                }
              }
            }
          });
          observer.observe(document.body, { subtree:true, childList:true, attributes:true, attributeFilter:["style"] });
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
