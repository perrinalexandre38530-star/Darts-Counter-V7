# =============================================
# wrangler.toml — Worker ONLINE + Sync Cloud + Dart Scanner
# =============================================

name = "dc-online-v3"
main = "src/online/server/worker.ts"
compatibility_date = "2024-11-15"
compatibility_flags = ["nodejs_compat"]

# Compte Cloudflare : ne pas figer account_id ici.
# Wrangler utilisera le compte actuellement authentifié pour `npm run deploy:online`.

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "RoomDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["RoomDO"]

# ➕ KV pour le cache des avatars IA (existant)
[[kv_namespaces]]
binding = "AVATAR_CACHE"
id = "65729b90e2d44fbe90db28bda837cd63"

# ➕ KV pour la synchronisation Cloud des stats (dc-sync)
# V68 DEPLOY FIX : DC_SYNC pointe sur le namespace KV existant et valide AVATAR_CACHE.
# Les clés du Worker sont isolées par préfixes sync: et viewer:, donc pas de collision.
[[kv_namespaces]]
binding = "DC_SYNC"
id = "65729b90e2d44fbe90db28bda837cd63"

# 🔥 Ton bucket R2 réel
[[r2_buckets]]
binding = "DART_IMAGES_BUCKET"
bucket_name = "dart-scans"

# 🔹 Workers AI
[ai]
binding = "AI"

# 🔹 Variables d'environnement (UN SEUL bloc [vars] !)
[vars]
# Liste vide => on accepte toutes les origines (dev + StackBlitz + app)
ALLOW_ORIGINS = ""

# URL publique de ton bucket R2
PUBLIC_BASE_URL = "https://pub-170ceab787594ee9a09d6315358fb928.r2.dev"
